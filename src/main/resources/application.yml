server:
  port: 8080
spring:
  application:
    name: sky-take-out
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sky_take_out?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: CHANGE_ME
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 1s
  cache:
    type: simple
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
sky:
  jwt:
    secret: change-this-secret-to-a-long-random-value-please-update
    ttl-hours: 24
